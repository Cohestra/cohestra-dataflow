# Fully isolated environment — everything runs in containers on one private
# network. Node.js is used only to build the React frontend.
#
# Default profile starts: postgres, redis, clickhouse, temporal,
# temporal-ui, api, worker, web  (~3 GB RAM total).
#
# Add observability services:
#   docker compose --profile observability up -d

x-app-env: &app-env
  DATABASE_URL: postgres://dataflow:dataflow@postgres:5432/dataflow
  # API connects as the lower-privilege, RLS-scoped role. Worker still uses
  # DATABASE_URL (superuser) because activities run system-level inserts
  # that span tenants (cron sync, schedule writes).
  APP_DATABASE_URL: postgres://dataflow_app:dataflow_app@postgres:5432/dataflow
  REDIS_URL: redis://redis:6379
  KAFKA_BROKERS: redpanda:9092
  KAFKA_CONNECT_URL: http://kafka-connect:8083
  TEMPORAL_ADDRESS: temporal:7233
  TEMPORAL_NAMESPACE: default
  TASK_QUEUE: dynamic-dag
  # OTel endpoint — only reachable when observability profile is active;
  # the SDK silently drops spans if the collector is unreachable.
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  APP_URL: http://localhost:3002
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret-change-me}
  AUTH_PASSWORD_ENABLED: ${AUTH_PASSWORD_ENABLED:-true}
  SMTP_HOST: ${SMTP_HOST:-email-smtp.us-east-1.amazonaws.com}
  SMTP_PORT: ${SMTP_PORT:-465}
  SMTP_FROM: ${SMTP_FROM:-noreply@dataflow.local}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_USER: dataflow
  CLICKHOUSE_PASSWORD: dataflow
  CLICKHOUSE_DB: dataflow
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:3002/api/auth/google/callback}
  AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
  AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
  AZURE_TENANT_ID: ${AZURE_TENANT_ID:-common}
  ZENDESK_OAUTH_CLIENT_ID: ${ZENDESK_OAUTH_CLIENT_ID:-}
  ZENDESK_OAUTH_CLIENT_SECRET: ${ZENDESK_OAUTH_CLIENT_SECRET:-}
  RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
  RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
  RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
  OAUTH_TOKEN_ENCRYPTION_KEY: ${OAUTH_TOKEN_ENCRYPTION_KEY:-}
  TEMPORAL_PAYLOAD_ENCRYPTION_KEY: ${TEMPORAL_PAYLOAD_ENCRYPTION_KEY:-}
  PAYLOAD_S3_BUCKET: ${PAYLOAD_S3_BUCKET:-}
  PAYLOAD_S3_REGION: ${PAYLOAD_S3_REGION:-us-east-1}
  PAYLOAD_S3_ENDPOINT: ${PAYLOAD_S3_ENDPOINT:-}
  PAYLOAD_S3_FORCE_PATH_STYLE: ${PAYLOAD_S3_FORCE_PATH_STYLE:-false}
  PAYLOAD_S3_ACCESS_KEY_ID: ${PAYLOAD_S3_ACCESS_KEY_ID:-}
  PAYLOAD_S3_SECRET_ACCESS_KEY: ${PAYLOAD_S3_SECRET_ACCESS_KEY:-}
  OPENLINEAGE_URL: ${OPENLINEAGE_URL:-}
  OPENLINEAGE_API_KEY: ${OPENLINEAGE_API_KEY:-}
  OPENLINEAGE_NAMESPACE: ${OPENLINEAGE_NAMESPACE:-dataflow}
  COHESTRA_URL: ${COHESTRA_URL:-http://host.docker.internal:8080}
  # ponytail: local simulated Cohestra only; set a registry digest for real Kubernetes.
  COHESTRA_FLINK_IMAGE: ${COHESTRA_FLINK_IMAGE:-dataflow-flink-sql@sha256:362650f23505dd07b809bf1f0d78c52fbc4e8ebaebd9204981672801b22c556d}
  WORKER_PUBLIC_KEY_PEM: ${WORKER_PUBLIC_KEY_PEM:-}
  # Open-core edition: 'community' (default) or 'enterprise'.
  EDITION: ${EDITION:-community}
  # AI builder (opt-in via `--profile ai`). When the ollama service is not
  # running the /api/ai/* routes return 503; the rest of the stack is unaffected.
  OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
  OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
  OLLAMA_THINK: ${OLLAMA_THINK:-false}
  # Connector SDK: drop *.manifest.json files in ./connectors/manifests and
  # they load on restart — no rebuild. The bundled examples ship in the image.
  CONNECTORS_DIR: /app/connectors/manifests

# Shared config for the per-environment worker pools (M3). Each pool overrides
# TEMPORAL_NAMESPACE + TASK_QUEUE for its environment.
x-worker-build: &worker-build
  context: .
  dockerfile: apps/workflow-go/Dockerfile

x-worker-volumes: &worker-volumes
  - ./secrets/worker-keypair.pem:/secrets/worker-keypair.pem:ro
  - ./connectors/manifests:/app/connectors/manifests:ro

x-worker-env: &worker-env
  <<: *app-env
  ZENDESK_SUBDOMAIN: ${ZENDESK_SUBDOMAIN:-}
  ZENDESK_EMAIL: ${ZENDESK_EMAIL:-}
  ZENDESK_API_TOKEN: ${ZENDESK_API_TOKEN:-}
  GOOGLE_SERVICE_ACCOUNT_JSON_BASE64: ${GOOGLE_SERVICE_ACCOUNT_JSON_BASE64:-}
  WORKER_PRIVATE_KEY_PATH: /secrets/worker-keypair.pem

services:
  # ───────── infrastructure ─────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dataflow
      POSTGRES_PASSWORD: dataflow
      POSTGRES_DB: dataflow
    volumes:
      # Mount only Postgres migration files — keeps ClickHouse SQL out of initdb.
      - ./db/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - ./db/002_auth.sql:/docker-entrypoint-initdb.d/002_auth.sql:ro
      - ./db/003_rls.sql:/docker-entrypoint-initdb.d/003_rls.sql:ro
      - ./db/004_oauth.sql:/docker-entrypoint-initdb.d/004_oauth.sql:ro
      - ./db/005_billing.sql:/docker-entrypoint-initdb.d/005_billing.sql:ro
      - ./db/006_dashboards.sql:/docker-entrypoint-initdb.d/006_dashboards.sql:ro
      - ./db/007_kms.sql:/docker-entrypoint-initdb.d/007_kms.sql:ro
      - ./db/008_environments.sql:/docker-entrypoint-initdb.d/008_environments.sql:ro
      - ./db/009_temporal_execution_identity.sql:/docker-entrypoint-initdb.d/009_temporal_execution_identity.sql:ro
      - ./db/010_connector_instances.sql:/docker-entrypoint-initdb.d/010_connector_instances.sql:ro
      - ./db/011_pipeline_alerts.sql:/docker-entrypoint-initdb.d/011_pipeline_alerts.sql:ro
      - ./db/012_execution_retries.sql:/docker-entrypoint-initdb.d/012_execution_retries.sql:ro
      - ./db/013_asset_materializations.sql:/docker-entrypoint-initdb.d/013_asset_materializations.sql:ro
      - ./db/014_data_quality.sql:/docker-entrypoint-initdb.d/014_data_quality.sql:ro
      - ./db/015_openlineage.sql:/docker-entrypoint-initdb.d/015_openlineage.sql:ro
      - ./db/016_backfills.sql:/docker-entrypoint-initdb.d/016_backfills.sql:ro
      - ./db/017_pipeline_rbac.sql:/docker-entrypoint-initdb.d/017_pipeline_rbac.sql:ro
      - ./db/018_oidc_sub.sql:/docker-entrypoint-initdb.d/018_oidc_sub.sql:ro
      - ./db/019_feature_entitlements.sql:/docker-entrypoint-initdb.d/019_feature_entitlements.sql:ro
      - ./db/020_cross_run_dedupe.sql:/docker-entrypoint-initdb.d/020_cross_run_dedupe.sql:ro
      - ./db/021_engine_entitlements.sql:/docker-entrypoint-initdb.d/021_engine_entitlements.sql:ro
      - ./db/022_flink_execution_state.sql:/docker-entrypoint-initdb.d/022_flink_execution_state.sql:ro
      - ./db/023_lineage_payload.sql:/docker-entrypoint-initdb.d/023_lineage_payload.sql:ro
      - ./db/024_pipeline_list_indexes.sql:/docker-entrypoint-initdb.d/024_pipeline_list_indexes.sql:ro
      - ./db/025_retention_function.sql:/docker-entrypoint-initdb.d/025_retention_function.sql:ro
      - ./db/026_runtime_lineage.sql:/docker-entrypoint-initdb.d/026_runtime_lineage.sql:ro
      - ./db/027_execution_controls.sql:/docker-entrypoint-initdb.d/027_execution_controls.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dataflow"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 512m
    networks: [dataflow]

  cassandra:
    image: cassandra:4.1.7
    environment:
      CASSANDRA_CLUSTER_NAME: dataflow-temporal
      MAX_HEAP_SIZE: 768M
      HEAP_NEWSIZE: 192M
    volumes:
      - cassdata:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE CLUSTER' >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
    mem_limit: 1536m
    networks: [dataflow]

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.27
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 45s
    mem_limit: 1g
    networks: [dataflow]

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 128m
    networks: [dataflow]

  # Opt-in CDC runtime. Neither broker nor Connect REST is published to the
  # host; the API is the authenticated control plane.
  redpanda:
    profiles: [cdc, realtime]
    image: docker.redpanda.com/redpandadata/redpanda:v26.1.10
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --default-log-level=info
      - --kafka-addr=internal://0.0.0.0:9092
      - --advertise-kafka-addr=internal://redpanda:9092
    volumes:
      - redpandadata:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health --exit-when-healthy"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 768m
    networks: [dataflow]

  kafka-connect:
    profiles: [cdc, realtime]
    image: quay.io/debezium/connect:3.5
    environment:
      BOOTSTRAP_SERVERS: redpanda:9092
      GROUP_ID: dataflow-cdc-connect
      CONFIG_STORAGE_TOPIC: dataflow_cdc_connect_configs
      OFFSET_STORAGE_TOPIC: dataflow_cdc_connect_offsets
      STATUS_STORAGE_TOPIC: dataflow_cdc_connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      STATUS_STORAGE_REPLICATION_FACTOR: "1"
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      REST_ADVERTISED_HOST_NAME: kafka-connect
      KAFKA_HEAP_OPTS: -Xms128m -Xmx512m
    depends_on:
      redpanda: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/connectors >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
    mem_limit: 1g
    networks: [dataflow]

  clickhouse:
    image: clickhouse/clickhouse-server:24.5-alpine
    environment:
      CLICKHOUSE_USER: dataflow
      CLICKHOUSE_PASSWORD: dataflow
      CLICKHOUSE_DB: dataflow
    volumes:
      - ./db/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./db/clickhouse/config.xml:/etc/clickhouse-server/config.d/storage.xml
      - chdata:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user dataflow --password dataflow --query 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 1g
    networks: [dataflow]

  mailhog:
    image: mailhog/mailhog:v1.0.1
    profiles: [mailhog]   # opt-in only: docker compose --profile mailhog up
    ports: ["8025:8025", "1025:1025"]
    mem_limit: 64m
    networks: [dataflow]

  # Temporal workflow history is stored only in Cassandra. Elasticsearch is
  # the advanced visibility store queried by Temporal UI.
  temporal-schema:
    image: temporalio/admin-tools:1.31.1
    environment:
      - CASSANDRA_SEEDS=cassandra
      - ES_SCHEME=http
      - ES_HOST=elasticsearch
      - ES_PORT=9200
      - ES_VERSION=v7
      - ES_VISIBILITY_INDEX=temporal_visibility_v1_dev
    depends_on:
      cassandra: { condition: service_healthy }
      elasticsearch: { condition: service_healthy }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        temporal-cassandra-tool --ep cassandra create -k temporal --rf 1
        temporal-cassandra-tool --ep cassandra -k temporal setup-schema -v 0.0
        temporal-cassandra-tool --ep cassandra -k temporal update-schema -d /etc/temporal/schema/cassandra/temporal/versioned
        temporal-elasticsearch-tool --ep http://elasticsearch:9200 setup-schema
        temporal-elasticsearch-tool --ep http://elasticsearch:9200 create-index --index temporal_visibility_v1_dev
    restart: "no"
    networks: [dataflow]

  temporal:
    image: temporalio/server:1.31.1
    environment:
      - CASSANDRA_SEEDS=cassandra
      - ENABLE_ES=true
      - ES_SEEDS=elasticsearch
      - ES_VERSION=v7
      - ES_VIS_INDEX=temporal_visibility_v1_dev
      - BIND_ON_IP=0.0.0.0
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/dataflow.yaml
    depends_on:
      temporal-schema: { condition: service_completed_successfully }
    volumes:
      - ./config/temporal-dynamicconfig.yaml:/etc/temporal/config/dynamicconfig/dataflow.yaml:ro
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7233"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 30s
    mem_limit: 512m
    networks: [dataflow]

  temporal-ui:
    image: temporalio/ui:2.49.1
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    ports: ["8082:8080"]
    depends_on:
      temporal: { condition: service_healthy }
    mem_limit: 128m
    networks: [dataflow]

  # One-shot: register the test + prod namespaces the worker pools and API
  # client use. Idempotent; the worker pools wait for this to complete.
  temporal-namespaces:
    image: temporalio/admin-tools:1.31.1
    depends_on:
      temporal: { condition: service_healthy }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        until temporal operator cluster health --address temporal:7233 >/dev/null 2>&1; do
          echo "waiting for temporal frontend…"; sleep 2; done
        for ns in test prod; do
          temporal operator namespace describe --address temporal:7233 --namespace "$$ns" >/dev/null 2>&1 \
            || temporal operator namespace create --address temporal:7233 --namespace "$$ns" --retention 3d
        done
        echo "namespaces test + prod ready"
    restart: "no"
    networks: [dataflow]

  # ───────── application ────────────────────────────────────────────────────

  api:
    build: { context: ., dockerfile: apps/workflow-go/Dockerfile }
    entrypoint: ["api"]
    volumes:
      # User-supplied connector manifests (zero-code REST connectors).
      - ./connectors/manifests:/app/connectors/manifests:ro
    environment:
      <<: *app-env
      API_PORT: "4000"
      ZENDESK_SUBDOMAIN: ${ZENDESK_SUBDOMAIN:-}
      ZENDESK_EMAIL: ${ZENDESK_EMAIL:-}
      ZENDESK_API_TOKEN: ${ZENDESK_API_TOKEN:-}
      GOOGLE_SERVICE_ACCOUNT_JSON_BASE64: ${GOOGLE_SERVICE_ACCOUNT_JSON_BASE64:-}
    depends_on:
      postgres:            { condition: service_healthy }
      redis:               { condition: service_healthy }
      clickhouse:          { condition: service_healthy }
      temporal:            { condition: service_started }
      temporal-namespaces: { condition: service_completed_successfully }
    mem_limit: 512m
    networks: [dataflow]
    ports: ["4000:4000"]

  # One worker pool per environment. Identical image; they differ only by the
  # namespace + task queue they poll (M3). Both wait for the namespaces to exist.
  worker-test:
    build: *worker-build
    entrypoint: ["activity-worker"]
    volumes: *worker-volumes
    environment:
      <<: *worker-env
      TEMPORAL_NAMESPACE: test
      TASK_QUEUE: dynamic-activities-test
    depends_on:
      postgres:            { condition: service_healthy }
      temporal-namespaces: { condition: service_completed_successfully }
    mem_limit: 768m
    networks: [dataflow]

  worker-prod:
    build: *worker-build
    entrypoint: ["activity-worker"]
    volumes: *worker-volumes
    environment:
      <<: *worker-env
      TEMPORAL_NAMESPACE: prod
      TASK_QUEUE: dynamic-activities-prod
    depends_on:
      postgres:            { condition: service_healthy }
      temporal-namespaces: { condition: service_completed_successfully }
    mem_limit: 768m
    networks: [dataflow]

  workflow-test:
    build:
      context: .
      dockerfile: apps/workflow-go/Dockerfile
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: test
      TASK_QUEUE: dynamic-dag-test
      TEMPORAL_PAYLOAD_ENCRYPTION_KEY: ${TEMPORAL_PAYLOAD_ENCRYPTION_KEY:-}
    depends_on:
      temporal-namespaces: { condition: service_completed_successfully }
    mem_limit: 256m
    networks: [dataflow]

  workflow-prod:
    build:
      context: .
      dockerfile: apps/workflow-go/Dockerfile
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: prod
      TASK_QUEUE: dynamic-dag-prod
      TEMPORAL_PAYLOAD_ENCRYPTION_KEY: ${TEMPORAL_PAYLOAD_ENCRYPTION_KEY:-}
    depends_on:
      temporal-namespaces: { condition: service_completed_successfully }
    mem_limit: 256m
    networks: [dataflow]

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    ports: ["3002:80"]
    depends_on: [api]
    mem_limit: 64m
    networks: [dataflow]

  # ───────── AI builder  (opt-in: --profile ai) ─────────────────────────────
  # Local LLM sidecar — no API key. First boot pulls the model (~5 GB for the
  # 8B default); override with OLLAMA_MODEL for a smaller/larger model.
  ollama:
    profiles: [ai]
    image: ollama/ollama:latest
    volumes:
      - ollamadata:/root/.ollama
    # Generous: an 8B model needs ~6-8 GB resident.
    mem_limit: 10g
    networks: [dataflow]

  # One-shot: waits for ollama then pulls the configured model. Idempotent.
  ollama-init:
    profiles: [ai]
    image: ollama/ollama:latest
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until ollama list >/dev/null 2>&1; do echo "waiting for ollama…"; sleep 2; done
        ollama pull "${OLLAMA_MODEL:-llama3.1:8b}"
    environment:
      - OLLAMA_HOST=http://ollama:11434
    depends_on: [ollama]
    restart: "no"
    networks: [dataflow]

  # ───────── Flink SQL runtime  (opt-in: --profile realtime) ────────────────
  flink-jobmanager:
    profiles: [realtime]
    image: dataflow-flink-sql
    build: { context: ., dockerfile: infra/flink/Dockerfile }
    command: jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        state.checkpoints.dir: file:///opt/flink/checkpoints
        execution.checkpointing.interval: 30s
    ports: ["8084:8081"]
    volumes: [flinkcheckpoints:/opt/flink/checkpoints]
    networks: [dataflow]

  flink-taskmanager:
    profiles: [realtime]
    image: dataflow-flink-sql
    build: { context: ., dockerfile: infra/flink/Dockerfile }
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
    depends_on: [flink-jobmanager]
    volumes: [flinkcheckpoints:/opt/flink/checkpoints]
    networks: [dataflow]

  flink-sql-gateway:
    profiles: [realtime]
    image: dataflow-flink-sql
    build: { context: ., dockerfile: infra/flink/Dockerfile }
    command: ["/opt/flink/bin/sql-gateway.sh", "start-foreground", "-Dsql-gateway.endpoint.rest.address=0.0.0.0"]
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
    depends_on: [flink-jobmanager]
    ports: ["8083:8083"]
    networks: [dataflow]

  # ───────── observability  (opt-in: --profile observability) ───────────────

  otel-collector:
    profiles: [observability]
    image: otel/opentelemetry-collector-contrib:0.103.0
    command: ["--config=/etc/otel/config.yml"]
    volumes:
      - ./observability/otel-collector.yml:/etc/otel/config.yml
    mem_limit: 128m
    networks: [dataflow]

  prometheus:
    profiles: [observability]
    image: prom/prometheus:v2.53.0
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml
    ports: ["9090:9090"]
    mem_limit: 256m
    networks: [dataflow]

  grafana:
    profiles: [observability]
    image: grafana/grafana:11.1.0
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_INSTALL_PLUGINS=grafana-clickhouse-datasource
    volumes:
      - ./observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/ds.yml
      - ./observability/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/db.yml
      - ./observability/dashboard-dataflow.json:/var/lib/grafana/dashboards/dataflow.json
    ports: ["3001:3000"]
    depends_on: [prometheus]
    mem_limit: 256m
    networks: [dataflow]

  jaeger:
    profiles: [observability]
    image: jaegertracing/all-in-one:1.58
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports: ["16686:16686"]
    mem_limit: 256m
    networks: [dataflow]

networks:
  dataflow:
    driver: bridge

volumes:
  pgdata:
  cassdata:
  esdata:
  chdata:
  ollamadata:
  redpandadata:
  flinkcheckpoints:
