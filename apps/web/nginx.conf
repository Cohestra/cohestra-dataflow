server {
  listen 80;
  server_tokens off;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # Razorpay Checkout is loaded client-side (apps/web/src/pages/BillingPage.tsx)
  # and needs its script + its own XHR/iframe origin; everything else is same-origin.
  # HSTS is not set here: Caddy (docker run caddy reverse-proxy, scripts/bootstrap.sh)
  # is the TLS-terminating edge, nginx only ever sees plain HTTP from it.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://checkout.razorpay.com; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'self' https://api.razorpay.com; frame-src https://api.razorpay.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

  # Caddy/Kind are the only hops before nginx in the supported topology. Trust
  # forwarding headers only from loopback/private proxy networks, then replace
  # outbound headers with nginx's validated client address.
  set_real_ip_from 127.0.0.0/8;
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  # ── Proxy /api/* to the API service ────────────────────────────────────────
  location /api/ {
    proxy_pass         http://api:4000/api/;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    # API trusts this internal reverse proxy. Replace, never append, with the
    # client address validated by nginx's trusted-proxy configuration above.
    proxy_set_header   X-Forwarded-For   $remote_addr;
    proxy_set_header   X-Forwarded-Proto $scheme;

    # Stripe / Razorpay webhooks post raw bodies — preserve them
    proxy_request_buffering off;

    # Increase timeout for long-running API calls (e.g. pipeline trigger,
    # AI pipeline generation — CPU-only Ollama on this box can take minutes).
    # Keep this above OLLAMA_TIMEOUT_SECONDS (480 in compose/Helm) so the API,
    # not the proxy, decides when a model call has taken too long.
    proxy_read_timeout 540s;
  }

  # ── Static SPA — catch-all for all client-side routes ──────────────────────
  # Covers: /, /login, /register, /forgot-password, /verify-email,
  #         /accept-invite, /pipelines/*, /connectors/*, /team,
  #         /billing, /settings, and any future routes.
  location / {
    root       /usr/share/nginx/html;
    index      index.html;
    try_files  $uri $uri/ /index.html;
  }
}
