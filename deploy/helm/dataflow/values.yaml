images:
  app: dataflow-app:local
  web: dataflow-web:local
  postgres: postgres:16-alpine
  redis: redis:7-alpine
  clickhouse: clickhouse/clickhouse-server:24.5-alpine
  temporal: temporalio/auto-setup:1.27.2
  temporalUI: temporalio/ui:2.39.0
  temporalAdmin: temporalio/admin-tools:1.31.1
  ollama: ollama/ollama:latest
  curl: curlimages/curl:8.9.1

hostPath: /workspace
# qwen3:8b + few-shot won the October 2026 CPU bake-off (docs/AI_MODEL_BAKEOFF.md);
# llama3.2:3b (the previous default) fits the old 4Gi limit but passed 4/12.
ollamaModel: qwen3:8b
# Models the AI builder's picker offers (default first); all are pulled.
# qwen3:4b-instruct-2507: 11/17 at ~1.7x the speed.
ollamaModels: [qwen3:8b, qwen3:4b-instruct-2507]
ollama:
  # Sized for an 8-9B Q4 model (~5-7 GB weights) plus an 8k KV cache; a 3-4B
  # model fits in 4Gi. 27B+ models (e.g. qwen3.6/3.8 27b) need ~24Gi and a GPU.
  resources:
    requests: {cpu: "1", memory: 4Gi}
    limits: {cpu: "4", memory: 12Gi}
  # Planner context window; few-shot examples need 8192.
  numCtx: 8192
  # Category-matched planner examples (see internal/api/ai_fewshot.go).
  fewShot: true
cohestraURL: http://cohestra-control-api.cohestra-system:8080
# Enables internal demo-only features in the API. Keep false in production.
internalDemoFeatures: false

web:
  nodePort: 30002
temporalUI:
  nodePort: 30082

backup:
  # GCS bucket for off-box upload of the 6-hourly pg_dump (empty = dump kept
  # on the node's data disk only). Uses the GCE metadata-server token; the VM
  # service account needs roles/storage.objectCreator on the bucket.
  gcsBucket: ""

storage:
  postgres: 2Gi
  redis: 2Gi
  clickhouse: 2Gi
  # Room for the model plus one replacement pull. Growing an existing PVC
  # needs a StorageClass with allowVolumeExpansion.
  ollama: 20Gi

runtime:
  # Production mode makes auth cookies Secure and refuses to start without
  # JWT, OAuth, Temporal encryption, and external data-service secrets.
  production: false

# SMTP — uses AWS SES by default.
# Credentials (smtpUser, smtpPass, smtpFrom) must be stored in the
# 'dataflow-secrets' Kubernetes Secret before running helm install/upgrade:
#   kubectl create secret generic dataflow-secrets \
#     --from-literal=jwt=<JWT_SECRET> \
#     --from-literal=smtpUser=<SES_SMTP_ACCESS_KEY_ID> \
#     --from-literal=smtpPass=<SES_SMTP_SECRET_ACCESS_KEY> \
#     --from-literal=smtpFrom=<VERIFIED_SENDER_EMAIL> \
#     --from-literal=appUrl=<PUBLIC_GCP_APP_URL>
smtp:
  host: email-smtp.us-east-1.amazonaws.com
  port: "465"

secrets: {}
