          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 256Mi}
          command: [workflow-worker]
          env:
            - {name: TEMPORAL_ADDRESS, value: temporal:7233}
            - {name: TEMPORAL_NAMESPACE, value: {{ $env }}}
            - {name: TASK_QUEUE, value: dynamic-dag-{{ $env }}}
