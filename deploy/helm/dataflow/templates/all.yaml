apiVersion: apps/v1
kind: Deployment
metadata: {name: web}
spec:
  replicas: 1
  selector: {matchLabels: {app: web}}
  template:
    metadata: {labels: {app: web}}
    spec:
      # ip_unprivileged_port_start is a kubelet-safe sysctl; it lets non-root
      # nginx bind :80 (an added NET_BIND_SERVICE never becomes ambient for a
      # non-root process, so a capability grant alone can't).
      securityContext: {fsGroup: 101, runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}, sysctls: [{name: net.ipv4.ip_unprivileged_port_start, value: "0"}]}
      containers:
        - name: web
          image: {{ .Values.images.web }}
          imagePullPolicy: Never
          # nginx:alpine runs as root by default; force the built-in nginx user.
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true, runAsUser: 101, runAsGroup: 101, capabilities: {drop: [ALL]}}
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 100m, memory: 128Mi}
          ports: [{containerPort: 80}]
          readinessProbe: {httpGet: {path: /login, port: 80}, periodSeconds: 5}
          volumeMounts:
            - {name: cache, mountPath: /var/cache/nginx}
            - {name: run, mountPath: /var/run}
      volumes:
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata: {name: web}
spec:
  type: NodePort
  selector: {app: web}
  ports: [{port: 80, targetPort: 80, nodePort: {{ .Values.web.nodePort }}}]
---
# Logical DB backup every 6h: dataflow (app), temporal, temporal_visibility
# (workflow history) — all three databases on the shared postgres instance.
# Dumps land on the persistent data disk (kind node /var -> docker volume on
# /var/lib/docker), so the daily 03:00 disk snapshot carries a <=6h-old dump
# off-box. When backup.gcsBucket is set, each dump is also uploaded to GCS
# using the GCE metadata-server token (VM SA needs roles/storage.objectCreator
# on the bucket).
apiVersion: batch/v1
kind: CronJob
metadata: {name: db-backup}
spec:
  schedule: "15 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 900
      template:
        metadata: {labels: {app: db-backup}}
        spec:
          restartPolicy: Never
          securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
          initContainers:
            - name: dump
              image: {{ .Values.images.postgres }}
              # Runs as the image's postgres user (70). /var/backups/dataflow on
              # the node is chown'd to 70:70 (one-time, part of the deploy
              # recipe) so the dump can write without root or a writable rootfs.
              securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true, runAsUser: 70, runAsGroup: 70, capabilities: {drop: [ALL]}}
              resources:
                requests: {cpu: 50m, memory: 128Mi}
                limits: {cpu: 500m, memory: 512Mi}
              env:
                - {name: PGPASSWORD, valueFrom: {secretKeyRef: {name: dataflow-secrets, key: postgresPassword}}}
              command:
                - sh
                - -ec
                - |
                  STAMP=$(date -u +%Y%m%dT%H%M%SZ)
                  for DB in dataflow temporal temporal_visibility; do
                    OUT="/backups/${DB}-backup-${STAMP}.sql.gz"
                    pg_dump -h postgres -U dataflow -d "$DB" | gzip > "$OUT"
                    gunzip -t "$OUT"
                    ls -1t "/backups/${DB}-backup-"*.sql.gz | tail -n +29 | xargs -r rm --
                    echo "backup OK: $(du -sh "$OUT" | cut -f1) $OUT"
                  done
              volumeMounts: [{name: backups, mountPath: /backups}]
          containers:
            - name: upload
              image: {{ .Values.images.curl }}
              # curlimages/curl's USER curl_user is a named user (uid 100), so
              # kubelet needs the numeric uid to verify runAsNonRoot; it only
              # reads /backups, so the mount can be read-only too.
              securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true, runAsUser: 100, runAsGroup: 101, capabilities: {drop: [ALL]}}
              resources:
                requests: {cpu: 25m, memory: 32Mi}
                limits: {cpu: 100m, memory: 128Mi}
              command:
                - sh
                - -ec
{{- if .Values.backup.gcsBucket }}
                - |
                  TOKEN=$(curl -sf -H "Metadata-Flavor: Google" \
                    "http://169.254.169.254/computeMetadata/v1/instance/service-accounts/default/token" \
                    | sed -E 's/.*"access_token" *: *"([^"]+)".*/\1/')
                  for DB in dataflow temporal temporal_visibility; do
                    OUT=$(ls -1t "/backups/${DB}-backup-"*.sql.gz | head -1)
                    curl -sf -o /dev/null -X POST -H "Authorization: Bearer $TOKEN" \
                      -H "Content-Type: application/gzip" --data-binary @"$OUT" \
                      "https://storage.googleapis.com/upload/storage/v1/b/{{ .Values.backup.gcsBucket }}/o?uploadType=media&name=$(basename "$OUT")"
                    echo "uploaded gs://{{ .Values.backup.gcsBucket }}/$(basename "$OUT")"
                  done
{{- else }}
                - echo "backup.gcsBucket not set - dump kept on data disk only"
{{- end }}
              volumeMounts: [{name: backups, mountPath: /backups, readOnly: true}]
          volumes:
            - name: backups
              hostPath: {path: /var/backups/dataflow, type: DirectoryOrCreate}
