apiVersion: batch/v1
kind: Job
metadata: {name: temporal-namespaces}
spec:
  template:
    metadata: {labels: {app: temporal-namespaces}}
    spec:
      restartPolicy: OnFailure
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: namespaces
          image: {{ .Values.images.temporalAdmin }}
          imagePullPolicy: IfNotPresent
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, capabilities: {drop: [ALL]}}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 200m, memory: 128Mi}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
          command: [sh, -c]
          args:
            - |
              until temporal operator cluster health --address temporal:7233; do sleep 2; done
              for ns in test prod; do
                temporal operator namespace describe --address temporal:7233 --namespace "$ns" >/dev/null 2>&1 || temporal operator namespace create --address temporal:7233 --namespace "$ns" --retention 3d
              done
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-data
  annotations: {helm.sh/resource-policy: keep}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: {{ .Values.storage.ollama }}}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: ollama}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: ollama}}
  template:
    metadata: {labels: {app: ollama}}
    spec:
      securityContext: {fsGroup: 1000, runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: ollama
          image: {{ .Values.images.ollama }}
          imagePullPolicy: IfNotPresent
          # Runs as uid 1000 with HOME=/home/ollama (verified against the deployed
          # image): ollama writes only under ~/.ollama (models PVC) and /tmp, both
          # mounted writable, so the rootfs stays read-only. The PVC dir on the
          # node must be owned by 1000:1000 (one-time chown, see deploy recipe).
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, capabilities: {drop: [ALL]}}
          command: [/bin/sh, -c]
          args:
            - |
              ollama serve & pid=$!
              until ollama list >/dev/null 2>&1; do sleep 1; done
              ollama pull "$OLLAMA_MODEL"
              touch /tmp/model-ready
              wait $pid
          env:
            - {name: OLLAMA_HOST, value: "0.0.0.0:11434"}
            - {name: OLLAMA_MODEL, value: {{ .Values.ollamaModel | quote }}}
            - {name: HOME, value: /home/ollama}
          ports: [{containerPort: 11434}]
          readinessProbe: {exec: {command: [test, -f, /tmp/model-ready]}, periodSeconds: 5}
          volumeMounts:
            - {name: home, mountPath: /home/ollama}
            - {name: data, mountPath: /home/ollama/.ollama}
            - {name: tmp, mountPath: /tmp}
          resources: {{ toJson .Values.ollama.resources }}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: ollama-data}
        - name: home
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata: {name: ollama}
spec: {selector: {app: ollama}, ports: [{port: 11434}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: api}
spec:
  replicas: 1
  selector: {matchLabels: {app: api}}
  template:
    metadata:
      labels: {app: api}
      annotations:
        checksum/secrets: {{ toJson .Values.secrets | sha256sum | quote }}
    spec:
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      initContainers:
        - name: wait-postgres
          image: {{ .Values.images.postgres }}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true, runAsUser: 70, runAsGroup: 70, capabilities: {drop: [ALL]}}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
          command: [sh, -c, "until pg_isready -h postgres -U dataflow -d dataflow; do sleep 2; done"]
      containers:
        - name: api
          image: {{ .Values.images.app }}
          imagePullPolicy: Never
          # The image's USER dataflow is a named user (uid 100), so kubelet
          # needs the numeric uid to verify runAsNonRoot. No local writes in
          # this binary, so the rootfs stays read-only.
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true, runAsUser: 100, runAsGroup: 101, capabilities: {drop: [ALL]}}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          command: [api]
          env:
            {{- include "dataflow.appEnv" . | nindent 12 }}
            - {name: API_PORT, value: "4000"}
            - {name: TEMPORAL_NAMESPACE, value: default}
            - {name: TASK_QUEUE, value: dynamic-dag}
            - {name: INTERNAL_DEMO_FEATURES, value: {{ .Values.internalDemoFeatures | quote }}}
          ports: [{containerPort: 4000}]
          readinessProbe: {tcpSocket: {port: 4000}, periodSeconds: 5}
          volumeMounts: [{name: connectors, mountPath: /app/connectors/manifests, readOnly: true}]
      volumes:
        - name: connectors
          hostPath: {path: {{ printf "%s/connectors/manifests" .Values.hostPath | quote }}, type: Directory}
---
apiVersion: v1
kind: Service
metadata: {name: api}
spec: {selector: {app: api}, ports: [{port: 4000}]}
---
