apiVersion: apps/v1
kind: Deployment
metadata: {name: activity-worker-{{ $env }}}
spec:
  replicas: 1
  selector: {matchLabels: {app: activity-worker-{{ $env }}}}
  template:
    metadata:
      labels: {app: activity-worker-{{ $env }}}
      annotations:
        checksum/secrets: {{ toJson $.Values.secrets | sha256sum | quote }}
    spec:
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: worker
          image: {{ $.Values.images.app }}
          imagePullPolicy: Never
          # Merge activities spill to a temp file (internal/activities/activities.go),
          # so /tmp needs to stay writable even with a read-only rootfs.
          # uid 100 = the image's named USER dataflow (kubelet needs it numeric).
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true, runAsUser: 100, runAsGroup: 101, capabilities: {drop: [ALL]}}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          command: [activity-worker]
          env:
            {{- include "dataflow.appEnv" $ | nindent 12 }}
            - {name: TEMPORAL_NAMESPACE, value: {{ $env }}}
            - {name: TASK_QUEUE, value: dynamic-activities-{{ $env }}}
            - {name: WORKER_PRIVATE_KEY_PATH, value: /secrets/worker-keypair.pem}
          volumeMounts:
            - {name: secrets, mountPath: /secrets, readOnly: true}
            - {name: connectors, mountPath: /app/connectors/manifests, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: secrets
          hostPath: {path: {{ printf "%s/secrets" $.Values.hostPath | quote }}, type: Directory}
        - name: connectors
          hostPath: {path: {{ printf "%s/connectors/manifests" $.Values.hostPath | quote }}, type: Directory}
        - name: tmp
          emptyDir: {}
---
