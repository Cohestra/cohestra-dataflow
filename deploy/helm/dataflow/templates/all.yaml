apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: clickhouse-data
  annotations: {helm.sh/resource-policy: keep}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: {{ .Values.storage.clickhouse }}}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: clickhouse}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: clickhouse}}
  template:
    metadata: {labels: {app: clickhouse}}
    spec:
      securityContext: {fsGroup: 101, runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: clickhouse
          image: {{ .Values.images.clickhouse }}
          imagePullPolicy: IfNotPresent
          # The entrypoint rewrites /etc/clickhouse-server/users.d/default-user.xml
          # at startup when a non-default CLICKHOUSE_USER is configured, and the
          # server logs to /var/log/clickhouse-server — both are emptyDir mounts
          # (like /tmp) so the rest of the rootfs stays read-only.
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true, runAsUser: 101, runAsGroup: 101, capabilities: {drop: [ALL]}}
          resources:
            requests: {cpu: 200m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
          env:
            - {name: CLICKHOUSE_USER, value: dataflow}
            - {name: CLICKHOUSE_PASSWORD, value: dataflow}
            - {name: CLICKHOUSE_DB, value: dataflow}
          ports: [{containerPort: 8123}]
          readinessProbe:
            exec: {command: [clickhouse-client, --user, dataflow, --password, dataflow, --query, SELECT 1]}
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - {name: data, mountPath: /var/lib/clickhouse}
            - {name: init, mountPath: /docker-entrypoint-initdb.d/init.sql, subPath: init.sql}
            - {name: users-d, mountPath: /etc/clickhouse-server/users.d}
            - {name: logs, mountPath: /var/log/clickhouse-server}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: clickhouse-data}
        - name: init
          hostPath: {path: {{ printf "%s/db/clickhouse" .Values.hostPath | quote }}, type: Directory}
        - name: users-d
          emptyDir: {}
        - name: logs
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata: {name: clickhouse}
spec: {selector: {app: clickhouse}, ports: [{port: 8123}]}
