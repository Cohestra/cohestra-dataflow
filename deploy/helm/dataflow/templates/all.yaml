apiVersion: apps/v1
kind: Deployment
metadata: {name: temporal}
spec:
  replicas: 1
  selector: {matchLabels: {app: temporal}}
  template:
    metadata: {labels: {app: temporal}}
    spec:
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      initContainers:
        - name: wait-postgres
          image: {{ .Values.images.postgres }}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true, runAsUser: 70, runAsGroup: 70, capabilities: {drop: [ALL]}}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
          command: [sh, -c, "until pg_isready -h postgres -U dataflow; do sleep 2; done"]
        # auto-setup renders /etc/temporal/config/docker.yaml at startup, so the
        # image's config dir is copied into an emptyDir that stays writable while
        # the rest of the rootfs is read-only.
        - name: config-copy
          image: {{ .Values.images.temporal }}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, capabilities: {drop: [ALL]}}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
          command: [sh, -c, "cp -r /etc/temporal/config/. /config/"]
          volumeMounts: [{name: config, mountPath: /config}]
      containers:
        - name: temporal
          image: {{ .Values.images.temporal }}
          imagePullPolicy: IfNotPresent
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, capabilities: {drop: [ALL]}}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
          env:
            - {name: DB, value: postgres12}
            - {name: DB_PORT, value: "5432"}
            - {name: POSTGRES_USER, value: dataflow}
            - {name: POSTGRES_PWD, valueFrom: {secretKeyRef: {name: dataflow-secrets, key: postgresPassword}}}
            - {name: POSTGRES_SEEDS, value: postgres}
            - {name: DBNAME, value: temporal}
            - {name: VISIBILITY_DBNAME, value: temporal_visibility}
          ports: [{containerPort: 7233}]
          readinessProbe: {tcpSocket: {port: 7233}, initialDelaySeconds: 10, periodSeconds: 5}
          volumeMounts: [{name: config, mountPath: /etc/temporal/config}]
      volumes:
        - name: config
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata: {name: temporal}
spec: {selector: {app: temporal}, ports: [{port: 7233}]}
---
apiVersion: apps/v1
