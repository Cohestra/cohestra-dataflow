name: Agent admission and execution controls

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  admission-and-control-transactions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dataflow
          POSTGRES_PASSWORD: dataflow
          POSTGRES_DB: controls_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dataflow -d controls_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CONTROL_TEST_DATABASE_URL: postgres://dataflow:dataflow@127.0.0.1:5432/controls_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/workflow-go/go.mod
          cache-dependency-path: apps/workflow-go/go.sum
      - name: Apply PostgreSQL migrations
        run: |
          for migration in db/[0-9][0-9][0-9]_*.sql; do
            psql "$CONTROL_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Verify durable controls with real transactions and RLS
        working-directory: apps/workflow-go
        env:
          # A -run filter that matches nothing, or a database test that skips,
          # must not pass silently. Every name here has to report PASS.
          REQUIRED_TESTS: >-
            TestAgentAdmissionRejectsStoredDefinitionsBeforeWrites
            TestAgentAdmissionRejectsBeforeAnyActivity
            TestControlAPITransactionsPermissionsAndTerminality
            TestControlDispatcherRecoveryAndRevisionCAS
            TestControlDispatcherStopsOnMissingWorkflow
            TestControlActivityAdmissionAndFinalization
            TestControlFirstResumeWakesLegacyHistory
            TestControlWatcherSurvivesTransientReadFailure
            TestPublicEntryPaymentWebhookCreditsTenantUnderRLS
            TestPublicEntryOAuthSignupClaimsInvitationUnderRLS
            TestPublicEntryPasswordSignupRequiresEmailVerification
            TestPublicEntryAPIRefusesRLSBypassRoleInProduction
            TestQuotaEnforcedOnlyWhenBillingEnabled
            TestControlPipelineVersionAndExecutionAccess
            TestPipelineAccessWithApplicationRoleRLS
        run: |
          set -o pipefail
          for tags in "" ee; do
            go test -race -tags "$tags" ./internal/api ./internal/workflows -run '^Test(Agent|Control|PublicEntry|Quota|PipelineAccess)' -count=1 -v | tee "/tmp/controls-${tags:-community}.log"
            for name in $REQUIRED_TESTS; do
              grep -q -- "--- PASS: $name " "/tmp/controls-${tags:-community}.log" || { echo "::error::$name did not pass (${tags:-community})"; exit 1; }
            done
          done
      - name: Verify Postgres connector paging and sink transactions
        working-directory: apps/workflow-go
        env:
          CONNECTOR_TEST_POSTGRES_URL: ${{ env.CONTROL_TEST_DATABASE_URL }}
        run: |
          set -o pipefail
          go test -race ./internal/connectors -run '^TestPostgres(FetchNeverDropsRowsSharingTheBoundaryCursor|SinkWritesAllBatchesOrNone)$' -count=1 -v | tee /tmp/connectors.log
          for name in TestPostgresFetchNeverDropsRowsSharingTheBoundaryCursor TestPostgresSinkWritesAllBatchesOrNone; do
            grep -q -- "--- PASS: $name " /tmp/connectors.log || { echo "::error::$name did not pass"; exit 1; }
          done
      - name: Verify ClickHouse tenant row filters
        working-directory: apps/workflow-go
        env:
          CLICKHOUSE_TEST_URL: http://127.0.0.1:18123
          CLICKHOUSE_TEST_ANALYTICS_PASSWORD: ci-analytics
        run: |
          set -o pipefail
          # Same image and files as docker-compose.yml, so a broken
          # users-analytics.xml fails here rather than at deploy time.
          docker run -d --name clickhouse -p 18123:8123 \
            -e CLICKHOUSE_USER=dataflow -e CLICKHOUSE_PASSWORD=dataflow -e CLICKHOUSE_DB=dataflow \
            -e CLICKHOUSE_ANALYTICS_PASSWORD="$CLICKHOUSE_TEST_ANALYTICS_PASSWORD" \
            -v "$GITHUB_WORKSPACE/db/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro" \
            -v "$GITHUB_WORKSPACE/db/clickhouse/users-analytics.xml:/etc/clickhouse-server/users.d/analytics.xml:ro" \
            "$(grep -m1 -o 'clickhouse/clickhouse-server:[^ ]*' "$GITHUB_WORKSPACE/docker-compose.yml")"
          for i in $(seq 1 60); do
            curl -sf -u dataflow:dataflow "$CLICKHOUSE_TEST_URL/?query=EXISTS%20dataflow.execution_metrics" | grep -q 1 && break
            sleep 2
          done
          go test ./internal/api -run '^TestClickhouse' -count=1 -v | tee /tmp/clickhouse.log
          grep -q -- "--- PASS: TestClickhouseAnalyticsUserIsolatesTenants " /tmp/clickhouse.log || { docker logs clickhouse | tail -50; echo "::error::TestClickhouseAnalyticsUserIsolatesTenants did not pass"; exit 1; }
